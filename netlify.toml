# Noam Cuts V8 — configuration Netlify
# Le site reste le MÊME (même adresse) : on relie juste ce dépôt au site existant.

[build]
  publish = "noam-cuts-github"
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

[dev]
  publish = "noam-cuts-github"
  framework = "#static"
  port = 8888

# --- Fichiers qui doivent TOUJOURS être revérifiés (sinon l'appli reste bloquée sur une vieille version)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# --- Images : versionnées avec ?v=, on peut les garder longtemps
[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- Sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
